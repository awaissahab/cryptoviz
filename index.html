<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>CryptoViz - Cryptography Visualizer</title>

    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Theme Variables */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f1f1f1;
            --bg-tertiary: #e7e7e7;
            --text-primary: #000000;
            --text-secondary: #333333;
            --text-muted: #666666;
            --border-color: #d9d9d9;
            --accent-green: #04AA6D;
            --accent-green-hover: #059862;
            --accent-green-light: #d9ede4;
            --code-bg: #f1f1f1;
            --success-bg: #d4edda;
            --success-text: #155724;
            --error-bg: #f8d7da;
            --error-text: #721c24;
            --warning-bg: #fff3cd;
            --warning-text: #856404;
            --info-bg: #d1ecf1;
            --info-text: #0c5460;
        }

        [data-theme="dark"] {
            --bg-primary: #282A35;
            --bg-secondary: #1E1F26;
            --bg-tertiary: #3A3C47;
            --text-primary: #F1F1F1;
            --text-secondary: #DCDCDC;
            --text-muted: #999999;
            --border-color: #3A3C47;
            --accent-green: #04AA6D;
            --accent-green-hover: #05C07D;
            --accent-green-light: #1a3d2e;
            --code-bg: #1E1F26;
            --success-bg: #1a3d2e;
            --success-text: #4ade80;
            --error-bg: #3d1a1a;
            --error-text: #f87171;
            --warning-bg: #3d3a1a;
            --warning-text: #fbbf24;
            --info-bg: #1a2d3d;
            --info-text: #60a5fa;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--accent-green) transparent;
        }

        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        *::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--accent-green);
            border-radius: 4px;
        }

        html {
            background-color: var(--bg-primary);
            transition: background-color 0.3s ease;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            transition: color 0.3s ease, background-color 0.3s ease;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        ::selection {
            background-color: var(--accent-green);
            color: white;
        }

        input, textarea, select {
            font-size: 16px;
        }

        @media (min-width: 640px) {
            input, textarea, select {
                font-size: inherit;
            }
        }

        .bg-primary { background-color: var(--bg-primary); }
        .bg-secondary { background-color: var(--bg-secondary); }
        .bg-tertiary { background-color: var(--bg-tertiary); }
        .text-primary { color: var(--text-primary); }
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .border-theme { border-color: var(--border-color); }
        .accent-green { background-color: var(--accent-green); color: white; }
        .accent-green:hover { background-color: var(--accent-green-hover); }
        .code-block { background-color: var(--code-bg); border: 1px solid var(--border-color); }
        .success-box { background-color: var(--success-bg); color: var(--success-text); }
        .error-box { background-color: var(--error-bg); color: var(--error-text); }
        .warning-box { background-color: var(--warning-bg); color: var(--warning-text); }
        .info-box { background-color: var(--info-bg); color: var(--info-text); }
        .transition-theme { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fadeSlideIn {
            animation: fadeSlideIn 0.4s ease-out;
        }

        .diagram-box {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
        }

        .concept-card {
            background-color: var(--bg-secondary);
            border-left: 4px solid var(--accent-green);
            padding: 1rem 1.5rem;
            margin: 1rem 0;
            border-radius: 0 8px 8px 0;
        }

        .step-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background-color: var(--accent-green);
            color: white;
            border-radius: 50%;
            font-weight: bold;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Theme Hook
        function useTheme() {
            const [theme, setTheme] = useState(() => {
                const saved = localStorage.getItem('cryptoviz-theme');
                return (saved === 'dark' || saved === 'light') ? saved : 'light';
            });

            useEffect(() => {
                localStorage.setItem('cryptoviz-theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => prev === 'light' ? 'dark' : 'light');
            };

            return { theme, toggleTheme };
        }

        // Crypto Utilities
        function caesarShiftChar(char, shift) {
            const code = char.charCodeAt(0);
            if (code >= 65 && code <= 90) {
                return String.fromCharCode(((code - 65 + shift) % 26) + 65);
            }
            if (code >= 97 && code <= 122) {
                return String.fromCharCode(((code - 97 + shift) % 26) + 97);
            }
            return char;
        }

        const caesarCipher = {
            id: 'caesar',
            name: 'Caesar Cipher',
            category: 'classical',
            description: 'One of the oldest encryption methods, used by Julius Caesar over 2000 years ago. Each letter in the message is replaced by a letter a fixed number of positions down the alphabet.',
            requiresKey: true,
            keyLabel: 'Shift (1-25)',
            encrypt: (plaintext, key) => {
                const shift = parseInt(key);
                const steps = [];

                if (isNaN(shift) || shift < 1 || shift > 25) {
                    return { ciphertext: '', steps: [], error: 'Shift value must be between 1 and 25' };
                }

                steps.push({
                    title: 'Step 1: The Original Message',
                    description: 'This is your plaintext — the message you want to keep secret. Anyone who reads it can understand it directly.',
                    type: 'info',
                    content: plaintext,
                    tip: 'Plaintext is the readable, original form of a message before encryption.',
                });

                steps.push({
                    title: 'Step 2: Choose a Secret Number',
                    description: `You chose the number ${shift}. This is your "key" — the secret that only you and the receiver know. Every letter will move ${shift} position${shift > 1 ? 's' : ''} forward in the alphabet.`,
                    type: 'info',
                    content: `Key = ${shift}`,
                    tip: 'The key is a secret value shared only between sender and receiver. Without it, the message cannot be decrypted.',
                });

                const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                const shifted = alphabet.split('').map(c => caesarShiftChar(c, shift));
                const mappings = alphabet.split('').map((c, i) => ({
                    from: c,
                    to: shifted[i],
                }));

                steps.push({
                    title: 'Step 3: Build the Substitution Map',
                    description: `Here's how every letter transforms. Each letter is replaced by the letter ${shift} positions ahead. For example, A becomes ${shifted[0]}, B becomes ${shifted[1]}, and so on.`,
                    type: 'mapping',
                    mappings,
                    tip: 'This is called a "substitution cipher" because each letter is substituted with another letter according to a fixed rule.',
                });

                const charSteps = plaintext.split('').map(char => {
                    const isLetter = /[a-zA-Z]/.test(char);
                    if (!isLetter) {
                        return { char, before: char, operation: 'unchanged (not a letter)', after: char };
                    }
                    const original = char.toUpperCase();
                    const result = caesarShiftChar(char, shift);
                    return {
                        char,
                        before: original,
                        operation: `${original} + ${shift} = ${result.toUpperCase()}`,
                        after: result,
                    };
                });

                steps.push({
                    title: 'Step 4: Transform Each Letter',
                    description: 'Now we go through the message letter by letter. Each letter is replaced using our substitution map. Spaces and punctuation stay the same.',
                    type: 'char-by-char',
                    charSteps,
                    tip: 'Non-letter characters (spaces, numbers, punctuation) are left unchanged in the Caesar cipher.',
                });

                const ciphertext = plaintext.split('').map(c => caesarShiftChar(c, shift)).join('');
                steps.push({
                    title: 'Step 5: The Encrypted Message',
                    description: 'This is your ciphertext — the encrypted result. Without knowing the key (' + shift + '), this looks like random gibberish to anyone else.',
                    type: 'result',
                    content: ciphertext,
                    tip: 'Ciphertext is the encrypted, unreadable form of a message. It can only be converted back to plaintext using the correct key.',
                });

                return { ciphertext, steps };
            },
            decrypt: (ciphertext, key) => {
                const shift = parseInt(key);
                const steps = [];

                if (isNaN(shift) || shift < 1 || shift > 25) {
                    return { plaintext: '', steps: [], error: 'Shift value must be between 1 and 25' };
                }

                steps.push({
                    title: 'Step 1: The Encrypted Message',
                    description: 'This is the ciphertext you received — it looks like gibberish because each letter has been shifted.',
                    type: 'info',
                    content: ciphertext,
                });

                steps.push({
                    title: 'Step 2: The Secret Key',
                    description: `You know the key is ${shift}. To decrypt, we need to reverse the process — shift every letter BACKWARD by ${shift} positions.`,
                    type: 'info',
                    content: `Reverse shift = -${shift}`,
                    tip: 'Decryption is the reverse of encryption. If encryption shifts forward, decryption shifts backward by the same amount.',
                });

                const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                const mappings = alphabet.split('').map(c => ({
                    from: c,
                    to: caesarShiftChar(c, 26 - shift),
                }));

                steps.push({
                    title: 'Step 3: Build the Reverse Map',
                    description: `To undo the encryption, each letter shifts BACKWARD by ${shift}. So ${alphabet[0]} came from ${caesarShiftChar(alphabet[0], shift)}, and so on.`,
                    type: 'mapping',
                    mappings,
                });

                const charSteps = ciphertext.split('').map(char => {
                    const isLetter = /[a-zA-Z]/.test(char);
                    if (!isLetter) {
                        return { char, before: char, operation: 'unchanged', after: char };
                    }
                    const result = caesarShiftChar(char, 26 - shift);
                    return {
                        char,
                        before: char.toUpperCase(),
                        operation: `${char.toUpperCase()} - ${shift} = ${result.toUpperCase()}`,
                        after: result,
                    };
                });

                steps.push({
                    title: 'Step 4: Reverse Each Letter',
                    description: 'Shift each letter backward by the key value to recover the original message.',
                    type: 'char-by-char',
                    charSteps,
                });

                const plaintext = ciphertext.split('').map(c => caesarShiftChar(c, 26 - shift)).join('');
                steps.push({
                    title: 'Step 5: The Original Message',
                    description: 'Success! The original plaintext has been recovered.',
                    type: 'result',
                    content: plaintext,
                    tip: 'If the result makes sense, you\'ve correctly decrypted the message!',
                });

                return { plaintext, steps };
            },
        };

        // Vigenère Cipher
        const vigenereCipher = {
            id: 'vigenere',
            name: 'Vigenère Cipher',
            category: 'classical',
            description: 'A polyalphabetic cipher using a keyword. Each letter is shifted by a different amount based on the keyword, making it much harder to crack than Caesar.',
            requiresKey: true,
            keyLabel: 'Keyword (letters only)',
            encrypt: (plaintext, key) => {
                const cleanKey = key.toUpperCase().replace(/[^A-Z]/g, '');
                const steps = [];

                if (!cleanKey) {
                    return { ciphertext: '', steps: [], error: 'Keyword must contain at least one letter (A-Z)' };
                }

                steps.push({
                    title: 'Step 1: The Original Message',
                    description: 'Your plaintext message that needs to be encrypted.',
                    type: 'info',
                    content: plaintext,
                });

                steps.push({
                    title: 'Step 2: The Keyword',
                    description: `Your keyword is "${cleanKey}". Each letter of the keyword tells us how much to shift the corresponding letter of the message. A=0, B=1, C=2, ... Z=25.`,
                    type: 'info',
                    content: `Keyword: ${cleanKey}`,
                    tip: 'The Vigenère cipher was considered "le chiffre indéchiffrable" (the indecipherable cipher) for 300 years!',
                });

                const keyValues = cleanKey.split('').map(c => ({
                    label: c,
                    value: c.charCodeAt(0) - 65,
                }));

                const ordinal = (n) => {
                    const s = ['th', 'st', 'nd', 'rd'];
                    const v = n % 100;
                    return (n + 1) + (s[(v - 20) % 10] || s[v] || s[0]);
                };

                steps.push({
                    title: 'Step 3: Convert Keyword to Shift Values',
                    description: 'Each letter of the keyword becomes a number representing how many positions to shift. A=0 (no shift), B=1, C=2, etc.',
                    type: 'table',
                    tableHeaders: ['Key Letter', 'Position', 'Shift Value'],
                    tableRows: keyValues.map(kv => [kv.label, `${ordinal(kv.value)} letter`, String(kv.value)]),
                });

                const tableRows = [];
                let keyIdx = 0;
                for (let i = 0; i < plaintext.length; i++) {
                    const c = plaintext[i];
                    if (/[a-zA-Z]/.test(c)) {
                        const keyLetter = cleanKey[keyIdx % cleanKey.length];
                        const shift = keyLetter.charCodeAt(0) - 65;
                        const result = caesarShiftChar(c, shift);
                        tableRows.push([c, keyLetter, String(shift), result]);
                        keyIdx++;
                    }
                }

                steps.push({
                    title: 'Step 4: Apply Different Shifts Per Letter',
                    description: 'Unlike Caesar (which uses one fixed shift), here each letter gets a different shift based on the keyword letter. The keyword repeats as needed.',
                    type: 'table',
                    tableHeaders: ['Original', 'Key Letter', 'Shift', 'Result'],
                    tableRows,
                    tip: 'This is why Vigenère is stronger — the same letter in plaintext can become different letters in ciphertext!',
                });

                let ciphertext = '';
                keyIdx = 0;
                for (let i = 0; i < plaintext.length; i++) {
                    const c = plaintext[i];
                    if (/[a-zA-Z]/.test(c)) {
                        const shift = cleanKey.charCodeAt(keyIdx % cleanKey.length) - 65;
                        ciphertext += caesarShiftChar(c, shift);
                        keyIdx++;
                    } else {
                        ciphertext += c;
                    }
                }

                steps.push({
                    title: 'Step 5: The Encrypted Message',
                    description: 'The final ciphertext.',
                    type: 'result',
                    content: ciphertext,
                });

                return { ciphertext, steps };
            },
            decrypt: (ciphertext, key) => {
                const cleanKey = key.toUpperCase().replace(/[^A-Z]/g, '');
                const steps = [];

                if (!cleanKey) {
                    return { plaintext: '', steps: [], error: 'Keyword must contain at least one letter (A-Z)' };
                }

                steps.push({
                    title: 'Step 1: The Encrypted Message',
                    description: 'The ciphertext to decrypt.',
                    type: 'info',
                    content: ciphertext,
                });

                steps.push({
                    title: 'Step 2: The Keyword',
                    description: `Using keyword "${cleanKey}" to reverse the encryption.`,
                    type: 'info',
                    content: `Keyword: ${cleanKey}`,
                });

                const tableRows = [];
                let keyIdx = 0;
                for (let i = 0; i < ciphertext.length; i++) {
                    const c = ciphertext[i];
                    if (/[a-zA-Z]/.test(c)) {
                        const keyLetter = cleanKey[keyIdx % cleanKey.length];
                        const shift = keyLetter.charCodeAt(0) - 65;
                        const result = caesarShiftChar(c, 26 - shift);
                        tableRows.push([c, keyLetter, `-${shift}`, result]);
                        keyIdx++;
                    }
                }

                steps.push({
                    title: 'Step 3: Reverse Each Shift',
                    description: 'Subtract the shift value for each letter to recover the original.',
                    type: 'table',
                    tableHeaders: ['Encrypted', 'Key Letter', 'Reverse Shift', 'Result'],
                    tableRows,
                });

                let plaintext = '';
                keyIdx = 0;
                for (let i = 0; i < ciphertext.length; i++) {
                    const c = ciphertext[i];
                    if (/[a-zA-Z]/.test(c)) {
                        const shift = cleanKey.charCodeAt(keyIdx % cleanKey.length) - 65;
                        plaintext += caesarShiftChar(c, 26 - shift);
                        keyIdx++;
                    } else {
                        plaintext += c;
                    }
                }

                steps.push({
                    title: 'Step 4: The Original Message',
                    description: 'The decrypted plaintext.',
                    type: 'result',
                    content: plaintext,
                });

                return { plaintext, steps };
            },
        };

        // XOR Cipher
        const xorCipher = {
            id: 'xor',
            name: 'XOR Cipher',
            category: 'modern',
            description: 'A bitwise cipher using XOR (exclusive OR). XOR compares two bits and returns 1 if they differ, 0 if they match. It\'s the foundation of many modern encryption algorithms.',
            requiresKey: true,
            keyLabel: 'Key (text)',
            encrypt: (plaintext, key) => {
                const steps = [];
                const keyBytes = key || 'secret';

                if (!keyBytes) {
                    return { ciphertext: '', steps: [], error: 'Key cannot be empty' };
                }

                steps.push({
                    title: 'Step 1: The Original Message',
                    description: 'Your plaintext message.',
                    type: 'info',
                    content: plaintext,
                });

                const plaintextBytes = Array.from(plaintext).map(c => c.charCodeAt(0));
                const keyBytesArray = Array.from(keyBytes).map(c => c.charCodeAt(0));

                const binaryRows = [];
                plaintext.split('').forEach((c) => {
                    binaryRows.push({
                        label: `"${c}"`,
                        value: `${c.charCodeAt(0)} → ${c.charCodeAt(0).toString(2).padStart(8, '0')}`,
                        color: 'cyan',
                    });
                });

                steps.push({
                    title: 'Step 2: Convert Text to Bytes',
                    description: 'Computers store text as numbers (ASCII/Unicode). Each character becomes a byte (8 bits).',
                    type: 'binary',
                    binaryRows,
                    tip: 'ASCII is a standard that assigns numbers to characters. For example, A=65, B=66, a=97, etc.',
                });

                const keyBinaryRows = [];
                keyBytes.split('').forEach((c) => {
                    keyBinaryRows.push({
                        label: `"${c}"`,
                        value: `${c.charCodeAt(0)} → ${c.charCodeAt(0).toString(2).padStart(8, '0')}`,
                        color: 'purple',
                    });
                });

                steps.push({
                    title: 'Step 3: Convert Key to Bytes',
                    description: 'The key is also converted to bytes. If the message is longer than the key, the key repeats.',
                    type: 'binary',
                    binaryRows: keyBinaryRows,
                });

                const xorRows = [];
                const encryptedBytes = [];
                plaintextBytes.forEach((byte, i) => {
                    const keyByte = keyBytesArray[i % keyBytesArray.length];
                    const result = byte ^ keyByte;
                    encryptedBytes.push(result);
                    xorRows.push([
                        plaintext[i],
                        byte.toString(2).padStart(8, '0'),
                        keyByte.toString(2).padStart(8, '0'),
                        result.toString(2).padStart(8, '0'),
                        String(result),
                    ]);
                });

                steps.push({
                    title: 'Step 4: XOR Each Byte',
                    description: 'XOR (⊕) compares bits: same bits = 0, different bits = 1. This is applied byte-by-byte with the repeating key.',
                    type: 'table',
                    tableHeaders: ['Char', 'Text (binary)', 'Key (binary)', 'XOR Result', 'Decimal'],
                    tableRows: xorRows,
                    tip: 'XOR has a special property: applying it twice with the same key gives back the original!',
                });

                const ciphertext = btoa(String.fromCharCode(...encryptedBytes));

                steps.push({
                    title: 'Step 5: Encode to Base64',
                    description: 'The XOR result contains raw bytes. Base64 encoding converts them to safe, printable characters.',
                    type: 'result',
                    content: ciphertext,
                });

                return { ciphertext, steps };
            },
            decrypt: (ciphertext, key) => {
                const steps = [];
                const keyBytes = key || 'secret';

                steps.push({
                    title: 'Step 1: The Encrypted Data',
                    description: 'The Base64-encoded ciphertext.',
                    type: 'info',
                    content: ciphertext,
                });

                let encryptedBytes;
                try {
                    encryptedBytes = Array.from(atob(ciphertext)).map(c => c.charCodeAt(0));
                } catch {
                    return { plaintext: '', steps: [], error: 'Invalid Base64 input' };
                }

                steps.push({
                    title: 'Step 2: Decode from Base64',
                    description: 'Convert Base64 back to raw bytes.',
                    type: 'info',
                    content: `Decoded ${encryptedBytes.length} bytes`,
                });

                const keyBytesArray = Array.from(keyBytes).map(c => c.charCodeAt(0));

                const xorRows = [];
                const decryptedBytes = [];
                encryptedBytes.forEach((byte, i) => {
                    const keyByte = keyBytesArray[i % keyBytesArray.length];
                    const result = byte ^ keyByte;
                    decryptedBytes.push(result);
                    xorRows.push([
                        String(byte),
                        byte.toString(2).padStart(8, '0'),
                        keyByte.toString(2).padStart(8, '0'),
                        result.toString(2).padStart(8, '0'),
                        String.fromCharCode(result),
                    ]);
                });

                steps.push({
                    title: 'Step 3: XOR Again (Reverses Encryption)',
                    description: 'Applying XOR with the same key reverses the encryption.',
                    type: 'table',
                    tableHeaders: ['Encrypted', 'Binary', 'Key Binary', 'XOR Result', 'Char'],
                    tableRows: xorRows,
                    tip: 'A ⊕ B ⊕ B = A. This mathematical property is what makes XOR reversible.',
                });

                const plaintext = String.fromCharCode(...decryptedBytes);

                steps.push({
                    title: 'Step 4: The Original Message',
                    description: 'Converting bytes back to text gives us the original message.',
                    type: 'result',
                    content: plaintext,
                });

                return { plaintext, steps };
            },
        };

        // AES (simplified educational version)
        const aesCipher = {
            id: 'aes',
            name: 'AES-256-GCM',
            category: 'modern',
            description: 'Advanced Encryption Standard — the gold standard used by governments, banks, and the military. AES-256 uses 256-bit keys and is considered unbreakable with current technology.',
            requiresKey: true,
            keyLabel: 'Password',
            encrypt: (plaintext, key) => {
                const steps = [];

                if (!key) {
                    return { ciphertext: '', steps: [], error: 'Password cannot be empty' };
                }

                steps.push({
                    title: 'Step 1: The Original Message',
                    description: 'Your plaintext message to encrypt.',
                    type: 'info',
                    content: plaintext,
                });

                steps.push({
                    title: 'Step 2: Derive a 256-bit Key',
                    description: 'Your password is converted to a 256-bit encryption key using PBKDF2. This runs 100,000 iterations to make brute-force attacks extremely slow.',
                    type: 'info',
                    content: `Password "${key}" → 256-bit key (via PBKDF2)`,
                    tip: 'PBKDF2 makes password cracking 100,000x slower by repeating the hashing process many times.',
                });

                steps.push({
                    title: 'Step 3: Generate Random IV',
                    description: 'An Initialization Vector (IV) is a random 96-bit value. It ensures the same message encrypted twice produces different ciphertexts.',
                    type: 'info',
                    content: 'Random 96-bit IV generated',
                    tip: 'Without an IV, identical messages would produce identical ciphertexts — a security weakness!',
                });

                steps.push({
                    title: 'Step 4: AES-256-GCM Encryption',
                    description: 'AES processes data in 128-bit blocks through 14 rounds of complex operations: substitution, permutation, mixing, and key addition.',
                    type: 'info',
                    content: `${plaintext.length} bytes → 14 AES rounds → encrypted blocks + auth tag`,
                    tip: 'AES-256 has 2²⁵⁶ possible keys. Even a supercomputer would take longer than the age of the universe to try them all!',
                });

                const ciphertext = `[AES-256-GCM: ${btoa(plaintext)}]`;

                steps.push({
                    title: 'Step 5: Combine Components',

                    return true;
                } catch (err) {
                    console.warn('Clipboard API failed:', err);
                }
            }
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                textarea.setSelectionRange(0, text.length);
                const success = document.execCommand('copy');
                document.body.removeChild(textarea);
                if (success) return true;

                let errorMsg;

                    outputResult = res.ciphertext;
                    newSteps = res.steps;
                    errorMsg = res.error;
                } else {
                    const res = selectedAlgorithm.decrypt(input, key);
                    outputResult = res.plaintext;
                    newSteps = res.steps;
                    errorMsg = res.error;
                }

                    setError(errorMsg);
                    setIsAnimating(false);
                    setSteps([]);
                    return;

                setSteps(newSteps);

                        stepIndex++;
                        if (stepIndex === newSteps.length) {

                        setIsAnimating(false);
                    }

                            <div className="mt-4 p-3 sm:p-4 rounded-lg bg-secondary border border-theme">
                                <p className="text-secondary text-xs sm:text-sm leading-relaxed">
                                    <span className="text-primary font-semibold">{selectedAlgorithm.name}:</span>{' '}
                                    {selectedAlgorithm.description}
                                </p>
                            </div>
                        </div>

                        {/* Mode Toggle */}
                        <div className="flex justify-center mb-6 sm:mb-8">
                            <div className="inline-flex bg-secondary border border-theme rounded-lg p-1 w-full sm:w-auto max-w-xs">
                                <button
                                    onClick={() => handleModeChange('encrypt')}
                                    className={`flex-1 sm:flex-none px-4 sm:px-6 py-2.5 rounded-md text-xs sm:text-sm font-medium transition-all duration-200 min-h-[44px] ${
                                        mode === 'encrypt' ? 'accent-green' : 'text-secondary hover:bg-tertiary'
                                    }`}
                                >
                                    🔒 Encrypt
                                </button>
                                <button
                                    onClick={() => handleModeChange('decrypt')}
                                    className={`flex-1 sm:flex-none px-4 sm:px-6 py-2.5 rounded-md text-xs sm:text-sm font-medium transition-all duration-200 min-h-[44px] ${
                                        mode === 'decrypt' ? 'accent-green' : 'text-secondary hover:bg-tertiary'
                                    }`}
                                >
                                    🔓 Decrypt
                                </button>
                            </div>
                        </div>

                        {/* Input Section */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4 mb-6 sm:mb-8">
                            <div className="bg-secondary border border-theme rounded-lg p-4 sm:p-5 transition-all duration-200 focus-within:border-[var(--accent-green)]">
                                <div className="flex items-center justify-between mb-3">
                                    <label className="text-xs sm:text-sm font-semibold text-primary">
                                        {mode === 'encrypt' ? '📝 Plaintext' : '🔐 Ciphertext'}
                                    </label>
                                    <span className="text-xs text-muted font-mono">{input.length} chars</span>
                                </div>
                                <textarea
                                    value={input}
                                    onChange={(e) => { setInput(e.target.value); setError(''); }}
                                    placeholder={mode === 'encrypt' ? 'Enter text to encrypt...' : 'Enter text to decrypt...'}
                                    className="w-full h-24 sm:h-28 bg-primary text-primary placeholder-muted resize-none focus:outline-none font-mono text-xs sm:text-sm leading-relaxed border border-theme rounded-md p-3"
                                />
                            </div>

                            <div className="bg-secondary border border-theme rounded-lg p-4 sm:p-5 transition-all duration-200 focus-within:border-[var(--accent-green)]">
                                <div className="flex items-center justify-between mb-3">
                                    <label className="text-xs sm:text-sm font-semibold text-primary">
                                        🔑 {selectedAlgorithm.keyLabel || 'Key'}
                                    </label>
                                    {!selectedAlgorithm.requiresKey && (
                                        <span className="text-[10px] sm:text-[11px] text-muted bg-tertiary px-2 py-0.5 rounded">Optional</span>
                                    )}
                                </div>
                                <input
                                    type="text"
                                    value={key}
                                    onChange={(e) => { setKey(e.target.value); setError(''); }}
                                    placeholder={selectedAlgorithm.requiresKey ? 'Enter key...' : 'Not required'}
                                    disabled={!selectedAlgorithm.requiresKey}
                                    className="w-full h-24 sm:h-28 bg-primary text-primary placeholder-muted focus:outline-none font-mono text-xs sm:text-sm leading-relaxed disabled:opacity-30 border border-theme rounded-md p-3"
                                />
                            </div>
                        </div>

                        {/* Process Button */}
                        <div className="flex justify-center mb-8 sm:mb-10">
                            <button
                                onClick={handleProcess}
                                disabled={!input.trim() || isAnimating}
                                className="group relative w-full sm:w-auto px-6 sm:px-8 py-3 sm:py-3.5 rounded-lg font-semibold text-white transition-all duration-200 disabled:opacity-30 disabled:cursor-not-allowed hover:scale-[1.02] active:scale-[0.98] accent-green shadow-lg min-h-[48px]"
                            >
                                <span className="relative z-10 flex items-center justify-center gap-2.5">
                                    {isAnimating ? (
                                        <>
                                            <svg className="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                                            </svg>
                                            <span className="text-sm sm:text-base">Processing...</span>
                                        </>
                                    ) : (
                                        <>
                                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                                <path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                                            </svg>
                                            <span className="text-sm sm:text-base">{mode === 'encrypt' ? '▶ Encrypt Now' : '▶ Decrypt Now'}</span>
                                        </>
                                    )}
                                </span>
                            </button>
                        </div>

                        {/* Error Message */}
                        {error && (
                            <div className="mb-8 max-w-2xl mx-auto">
                                <div className="error-box rounded-lg p-4 flex items-start gap-3 border border-[var(--error-text)]/20">
                                    <svg className="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                    </svg>
                                    <div className="flex-1">
                                        <p className="text-sm font-semibold">{error}</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Step Visualization */}
                        {steps.length > 0 && (
                            <div className="mb-8 sm:mb-10">
                                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 sm:mb-6 gap-3">
                                    <h2 className="text-lg sm:text-xl font-bold text-primary flex items-center gap-2">
                                        <span className="w-2 h-2 rounded-full bg-[var(--accent-green)] animate-pulse flex-shrink-0" />
                                        <span>Step-by-Step Breakdown</span>
                                    </h2>
                                    <span className="text-xs text-muted font-mono bg-secondary px-3 py-1.5 rounded-md border border-theme whitespace-nowrap">
                                        Step {Math.min(currentStep + 1, steps.length)} of {steps.length}
                                    </span>
                                </div>

                                <div className="relative h-2 bg-tertiary rounded-full mb-6 sm:mb-8 overflow-hidden">
                                    <div
                                        className="absolute h-full bg-[var(--accent-green)] rounded-full transition-all duration-700 ease-out"
                                        style={{ width: `${((currentStep + 1) / steps.length) * 100}%` }}
                                    />
                                </div>

                                <div className="space-y-3 sm:space-y-4">
                                    {steps.map((step, index) => (
                                        <div
                                            key={index}
                                            className={`rounded-lg border transition-all duration-500 overflow-hidden ${
                                                index < currentStep
                                                    ? 'bg-secondary border-theme'
                                                    : index === currentStep
                                                    ? 'bg-secondary border-[var(--accent-green)] shadow-md'
                                                    : 'bg-primary border-theme opacity-40'
                                            }`}
                                        >
                                            <div className="p-3 sm:p-5">
                                                <div className="flex items-start gap-3 sm:gap-4">
                                                    <div className={`flex-shrink-0 w-9 h-9 sm:w-10 sm:h-10 rounded-lg flex items-center justify-center font-bold text-xs sm:text-sm transition-all duration-500 ${
                                                        index < currentStep
                                                            ? 'bg-[var(--accent-green)] text-white'
                                                            : index === currentStep
                                                            ? 'bg-[var(--accent-green)] text-white'
                                                            : 'bg-tertiary text-muted'
                                                    }`}>
                                                        {index < currentStep ? (
                                                            <svg className="w-4 h-4 sm:w-5 sm:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                                                                <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                                                            </svg>
                                                        ) : (
                                                            index + 1
                                                        )}
                                                    </div>

                                                    <div className="flex-1 min-w-0">
                                                        <h3 className={`text-sm sm:text-base font-bold mb-2 transition-colors duration-300 ${
                                                            index <= currentStep ? 'text-primary' : 'text-muted'
                                                        }`}>
                                                            {step.title}
                                                        </h3>
                                                        <p className={`text-xs sm:text-sm mb-3 sm:mb-4 leading-relaxed transition-colors duration-300 ${
                                                            index <= currentStep ? 'text-secondary' : 'text-muted'
                                                        }`}>
                                                            {step.description}
                                                        </p>

                                                        {index <= currentStep && <StepContent step={step} />}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Result */}
                        {result && (
                            <div className="mb-8 sm:mb-10 animate-fadeSlideIn">
                                <div className="success-box rounded-lg p-4 sm:p-5 border-2 border-[var(--success-text)]/30">
                                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 gap-3">
                                        <label className="text-xs sm:text-sm font-bold text-primary">
                                            ✅ {mode === 'encrypt' ? 'Encrypted Result' : 'Decrypted Result'}
                                        </label>
                                        <button
                                            onClick={handleCopy}
                                            className={`px-4 py-2.5 rounded-md text-xs font-semibold transition-all duration-200 flex items-center gap-1.5 min-h-[44px] w-full sm:w-auto justify-center ${
                                                copied
                                                    ? 'accent-green'
                                                    : copyFailed
                                                    ? 'warning-box border border-[var(--warning-text)]/30'
                                                    : 'bg-primary text-primary border border-theme hover:bg-secondary'
                                            }`}
                                        >
                                            {copied ? (
                                                <>
                                                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                                                        <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                                                    </svg>
                                                    Copied!
                                                </>
                                            ) : copyFailed ? (
                                                <>
                                                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                                        <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                    </svg>
                                                    Select & Ctrl+C
                                                </>
                                            ) : (
                                                <>
                                                    <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                                        <path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                                    </svg>
                                                    Copy Result
                                                </>
                                            )}
                                        </button>
                                    </div>
                                    <div
                                        data-result
                                        className="font-mono text-xs sm:text-sm text-primary break-all min-h-[56px] whitespace-pre-wrap bg-primary rounded-md p-3 sm:p-4 border border-theme leading-relaxed"
                                    >
                                        {result}
                                    </div>
                                </div>
                            </div>
                        )}

                            </>
                        )}

                        {/* Academy View */}
                        {currentView === 'academy' && (
                            <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                                {/* Sidebar Navigation */}
                                <div className="lg:col-span-1">
                                    <div className="bg-secondary rounded-lg border border-theme p-4 sticky top-4">
                                        <h2 className="font-bold text-primary mb-4 text-sm uppercase tracking-wide">Chapters</h2>
                                        <nav className="space-y-2">
                                            {chapters.map((chapter) => (
                                                <button
                                                    key={chapter.id}
                                                    onClick={() => setActiveChapter(chapter.id)}
                                                    className={`w-full text-left px-3 py-2.5 rounded-lg transition-all text-sm ${
                                                        activeChapter === chapter.id
                                                            ? 'accent-green'
                                                            : 'text-secondary hover:bg-tertiary'
                                                    }`}
                                                >
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-lg">{chapter.icon}</span>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="font-medium truncate">{chapter.title}</div>
                                                            <div className="text-xs opacity-75">{chapter.level}</div>
                                                        </div>
                                                    </div>
                                                </button>
                                            ))}
                                        </nav>
                                    </div>
                                </div>

                                {/* Main Content */}
                                <div className="lg:col-span-3">
                                    <div className="bg-primary rounded-lg border border-theme p-6 sm:p-8">
                                        <div
                                            className="prose prose-sm sm:prose max-w-none"
                                            dangerouslySetInnerHTML={{ __html: chapters.find(ch => ch.id === activeChapter).content }}
                                        />
                                    </div>

                                    {/* Navigation Buttons */}
                                    <div className="flex justify-between mt-6 gap-4">
                                        {chapters.findIndex(ch => ch.id === activeChapter) > 0 && (
                                            <button
                                                onClick={() => {
                                                    const idx = chapters.findIndex(ch => ch.id === activeChapter);
                                                    setActiveChapter(chapters[idx - 1].id);
                                                }}
                                                className="px-4 py-2 bg-secondary border border-theme rounded-lg text-sm font-medium text-secondary hover:bg-tertiary transition-all min-h-[44px]"
                                            >
                                                ← Previous
                                            </button>
                                        )}
                                        <div className="flex-1"></div>
                                        {chapters.findIndex(ch => ch.id === activeChapter) < chapters.length - 1 && (
                                            <button
                                                onClick={() => {
                                                    const idx = chapters.findIndex(ch => ch.id === activeChapter);
                                                    setActiveChapter(chapters[idx + 1].id);
                                                }}
                                                className="px-4 py-2 accent-green rounded-lg text-sm font-medium transition-all hover:scale-105 min-h-[44px]"
                                            >
                                                Next →
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Download Button */}
                        <div className="text-center mb-6">
                            <button
                                onClick={() => {
                                    const htmlContent = document.documentElement.outerHTML;
                                    const blob = new Blob([htmlContent], { type: 'text/html' });
                                    const url = URL.createObjectURL(blob);
                                    const a = document.createElement('a');
                                    a.href = url;
                                    a.download = 'cryptoviz.html';
                                    document.body.appendChild(a);
                                    a.click();
                                    document.body.removeChild(a);
                                    URL.revokeObjectURL(url);
                                }}
                                className="px-6 py-3 accent-green rounded-lg font-semibold text-sm transition-all hover:scale-105 active:scale-95 min-h-[48px] inline-flex items-center gap-2"
                            >
                                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                                Download as HTML File
                            </button>
                        </div>

                        {/* Footer */}
                        <footer className="text-center pt-6 border-t border-theme mt-8">
                            <p className="text-xs text-muted px-2">
                                🔒 All operations run locally in your browser. No data is sent to any server.
                            </p>
                            <p className="text-xs text-muted mt-2 px-2">
                                Student of Emerson University Multan
                            </p>
                        </footer>
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
